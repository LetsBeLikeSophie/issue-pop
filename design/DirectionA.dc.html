<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
  </style>
</helmet>

<div style="width:390px;height:540px;background:#fff9fb;display:flex;flex-direction:column;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;color:#18181b;overflow:hidden;">

  <div style="flex-shrink:0;padding:16px 16px 4px;">
    <div style="font-size:11px;font-weight:800;color:#a1a1aa;letter-spacing:0.05em;">방향 A · Y2K 팝</div>
  </div>

  <div style="flex-shrink:0;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;">
    <div style="font-size:21px;font-weight:900;color:#ff2f92;">뉴스</div>
    <div style="display:flex;gap:12px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#18181b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12v16l-6-4-6 4V4z"/></svg>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#18181b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1.5-3.5 4.5-5 7.5-5s6 1.5 7.5 5"/></svg>
    </div>
  </div>

  <div style="flex-shrink:0;padding:10px 16px;">
    <div style="background:#c6ff3d;border:2.5px solid #18181b;border-radius:14px;height:42px;display:flex;align-items:center;gap:8px;padding:0 12px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#18181b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <span style="font-size:13.5px;font-weight:800;color:#18181b;">이슈, 키워드 검색</span>
    </div>
  </div>

  <div style="flex:1;padding:6px 16px;display:flex;flex-direction:column;gap:12px;">
    <div style="font-size:12px;font-weight:800;color:#a1a1aa;">지속 관심 카테고리</div>

    <div style="background:#ffffff;border:2.5px solid #18181b;border-radius:16px;padding:14px;box-shadow:4px 4px 0 #18181b;position:relative;">
      <span style="position:absolute;top:-10px;right:14px;background:#ff2f92;color:#fff;font-size:10px;font-weight:800;padding:3px 8px;border-radius:20px;border:2px solid #18181b;">HOT</span>
      <div style="font-size:12px;font-weight:800;color:#71717a;">오늘 날씨 · 폭염특보</div>
      <div style="display:flex;margin-top:8px;">
        <div style="flex:1;text-align:center;"><div style="font-size:10.5px;color:#a1a1aa;font-weight:700;">어제</div><div style="font-size:14px;font-weight:800;color:#71717a;">33.8℃</div></div>
        <div style="flex:1;text-align:center;"><div style="font-size:10.5px;color:#ff2f92;font-weight:800;">오늘</div><div style="font-size:19px;font-weight:900;color:#ff2f92;">35.2℃</div></div>
        <div style="flex:1;text-align:center;"><div style="font-size:10.5px;color:#a1a1aa;font-weight:700;">내일</div><div style="font-size:14px;font-weight:800;color:#71717a;">34.5℃</div></div>
      </div>
    </div>

    <div style="background:#ffe94d;border:2.5px solid #18181b;border-radius:14px;padding:11px 14px;display:flex;align-items:center;gap:10px;transform:rotate(-1deg);">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#18181b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M5 21V4"/><path d="M5 4h13l-3 4 3 4H5"/></svg>
      <div style="flex:1;font-size:13.5px;font-weight:800;">국민연금 개편안</div>
      <span style="background:#18181b;color:#fff;font-size:11px;font-weight:800;padding:4px 9px;border-radius:20px;">D+18</span>
    </div>

    <div style="background:#ffffff;border:2.5px solid #18181b;border-radius:12px;padding:11px 14px;display:flex;align-items:center;gap:10px;">
      <div style="width:22px;height:22px;border-radius:50%;background:#38e0e0;border:2px solid #18181b;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;">1</div>
      <div style="flex:1;font-size:13.5px;font-weight:800;">전기요금 개편</div>
      <span style="background:#f4f4f5;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:20px;">74건</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
