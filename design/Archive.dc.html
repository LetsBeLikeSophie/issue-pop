<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }

    .theme-root {
      --color-bg: #f0eee9;
      --color-card: #fbf8f2;
      --color-card-shadow: 0 1px 3px rgba(46,42,36,0.07);
      --color-ink: #2e2a24;
      --color-ink-muted: #8a8378;
      --color-accent-1: #7c8f6e;
      --color-accent-2: #b5703f;
    }
  </style>
</helmet>

<div class="theme-root" style="width:390px;height:844px;background:var(--color-bg);display:flex;flex-direction:column;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;color:var(--color-ink);overflow:hidden;">

  <!-- Top bar -->
  <div style="flex-shrink:0;height:56px;display:flex;align-items:center;gap:10px;padding:0 12px;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    <div style="font-size:17px;font-weight:700;">저장한 이슈</div>
  </div>

  <div style="flex:1;overflow:hidden;padding:12px 16px;display:flex;flex-direction:column;gap:10px;">

    <div style="background:var(--color-card);box-shadow:var(--color-card-shadow);border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center;">
      <div style="width:26px;height:26px;border-radius:50%;background:var(--color-accent-2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transform:rotate(-6deg);">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M6 4h12v16l-6-4-6 4V4z"/></svg>
      </div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:14.5px;font-weight:700;line-height:1.35;">지하철 파업 예고</div>
        <div style="font-size:11.5px;color:var(--color-ink-muted);margin-top:4px;">저장일 8월 20일 · 기사 61건</div>
      </div>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--color-ink-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M9 18l6-6-6-6"/></svg>
    </div>

    <div style="background:var(--color-card);box-shadow:var(--color-card-shadow);border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center;">
      <div style="width:26px;height:26px;border-radius:50%;background:var(--color-accent-2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transform:rotate(4deg);">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M6 4h12v16l-6-4-6 4V4z"/></svg>
      </div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:14.5px;font-weight:700;line-height:1.35;">전기요금 개편</div>
        <div style="font-size:11.5px;color:var(--color-ink-muted);margin-top:4px;">저장일 8월 19일 · 기사 74건</div>
      </div>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--color-ink-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M9 18l6-6-6-6"/></svg>
    </div>

    <div style="background:var(--color-card);box-shadow:var(--color-card-shadow);border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center;">
      <div style="width:26px;height:26px;border-radius:50%;background:var(--color-accent-2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transform:rotate(-3deg);">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M6 4h12v16l-6-4-6 4V4z"/></svg>
      </div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:14.5px;font-weight:700;line-height:1.35;">국민연금 개편안</div>
        <div style="font-size:11.5px;color:var(--color-ink-muted);margin-top:4px;">저장일 8월 15일 · 기사 98건</div>
      </div>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--color-ink-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M9 18l6-6-6-6"/></svg>
    </div>

  </div>

  <!-- Bottom nav -->
  <div style="flex-shrink:0;height:64px;background:var(--color-card);box-shadow:0 -1px 3px rgba(46,42,36,0.06);display:flex;align-items:center;justify-content:space-around;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--color-ink-muted);">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
      <span style="font-size:10.5px;">홈</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--color-accent-1);">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
      <span style="font-size:10.5px;font-weight:700;">뉴스</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--color-ink-muted);">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M18 6l-2.5 2.5M8.5 15.5L6 18"/></svg>
      <span style="font-size:10.5px;">뷰티</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--color-ink-muted);">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21c-4-.5-7-3.8-7-8 0-3.3 2-5 4-5 1 0 1.7.4 2 .6.3-.2 1-.6 2-.6 2 0 4 1.7 4 5 0 4.2-3 7.5-7 8z"/><path d="M12 8c0-2 1-3.5 3-4"/></svg>
      <span style="font-size:10.5px;">식품</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
