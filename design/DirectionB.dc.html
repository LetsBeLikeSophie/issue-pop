<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700;900&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
  </style>
</helmet>

<div style="width:390px;height:620px;background:#f3efe4;display:flex;flex-direction:column;font-family:'Noto Serif KR',Batang,'Apple SD Gothic Neo',serif;color:#1c1911;overflow:hidden;">

  <div style="flex-shrink:0;padding:14px 16px 0;">
    <div style="font-family:-apple-system,sans-serif;font-size:10.5px;font-weight:800;color:#8f2d24;letter-spacing:0.05em;margin-bottom:10px;">방향 B (전체 세리프 + 아이콘/뱃지 보강)</div>

    <div style="display:flex;justify-content:flex-end;gap:14px;margin-bottom:8px;color:#1c1911;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12v16l-6-4-6 4V4z"/></svg>
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1.5-3.5 4.5-5 7.5-5s6 1.5 7.5 5"/></svg>
    </div>

    <div style="display:flex;align-items:center;justify-content:center;gap:8px;">
      <svg width="6" height="6" viewBox="0 0 10 10"><rect x="1" y="1" width="8" height="8" transform="rotate(45 5 5)" fill="#8f2d24"/></svg>
      <div style="font-size:10px;letter-spacing:0.3em;color:#6b6459;font-weight:600;">오늘의 트렌드</div>
      <svg width="6" height="6" viewBox="0 0 10 10"><rect x="1" y="1" width="8" height="8" transform="rotate(45 5 5)" fill="#8f2d24"/></svg>
    </div>
    <div style="text-align:center;">
      <div style="font-size:32px;font-weight:900;color:#1c1911;margin-top:3px;">뉴스</div>
    </div>
    <div style="height:3px;background:#1c1911;margin-top:10px;"></div>
    <div style="height:1px;background:#1c1911;margin-top:2px;"></div>
  </div>

  <div style="flex-shrink:0;padding:12px 16px 0;">
    <div style="border:1px solid #1c1911;border-radius:2px;height:40px;display:flex;align-items:center;gap:8px;padding:0 12px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6b6459" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <span style="font-size:12.5px;color:#6b6459;">이슈, 키워드 검색</span>
    </div>
  </div>

  <div style="flex:1;padding:14px 16px 6px;display:flex;flex-direction:column;gap:14px;">

    <div style="font-size:10.5px;font-weight:700;color:#6b6459;letter-spacing:0.08em;">지속 관심 카테고리</div>

    <div style="border:1px solid #1c1911;padding:14px;">
      <div style="display:inline-flex;align-items:center;gap:4px;border:1px solid #1c1911;padding:2px 7px;color:#1c1911;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
        <span style="font-size:9.5px;font-weight:700;letter-spacing:0.04em;">기상</span>
      </div>
      <div style="font-size:12.5px;color:#4a463c;margin-top:9px;">오늘 날씨 · 폭염특보</div>
      <div style="display:flex;margin-top:9px;">
        <div style="flex:1;text-align:center;">
          <div style="font-family:-apple-system,sans-serif;font-size:10px;color:#8a8578;">어제</div>
          <div style="font-size:15px;font-weight:700;color:#4a463c;">33.8℃</div>
        </div>
        <div style="flex:1;text-align:center;border-left:1px solid #d9d2bd;border-right:1px solid #d9d2bd;">
          <div style="font-family:-apple-system,sans-serif;font-size:10px;color:#8f2d24;font-weight:700;">오늘</div>
          <div style="font-size:21px;font-weight:800;color:#8f2d24;">35.2℃</div>
        </div>
        <div style="flex:1;text-align:center;">
          <div style="font-family:-apple-system,sans-serif;font-size:10px;color:#8a8578;">내일</div>
          <div style="font-size:15px;font-weight:700;color:#4a463c;">34.5℃</div>
        </div>
      </div>
      <div style="font-size:11px;color:#6b6459;margin-top:10px;font-style:italic;">평년보다 6.3℃ 높음 · 폭염특보 5일째</div>
    </div>

    <div style="border-top:1px solid #1c1911;border-bottom:1px solid #1c1911;padding:10px 2px;display:flex;align-items:center;gap:10px;">
      <div style="display:inline-flex;align-items:center;gap:3px;border:1px solid #1c1911;padding:1px 6px;flex-shrink:0;color:#1c1911;">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 4h13l-3 4 3 4H5"/></svg>
        <span style="font-size:9px;font-weight:700;">연재</span>
      </div>
      <div style="flex:1;font-size:14px;font-weight:700;">국민연금 개편안</div>
      <span style="color:#8f2d24;font-size:13px;font-weight:800;flex-shrink:0;">D+18일째</span>
    </div>

    <div>
      <div style="font-size:10.5px;font-weight:700;color:#6b6459;letter-spacing:0.08em;margin-bottom:4px;">오늘 많이 언급된 키워드</div>
      <div style="display:flex;align-items:center;gap:9px;padding:10px 2px;border-bottom:1px solid #d9d2bd;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="#8f2d24" style="flex-shrink:0;"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 7-6.3-3.9L5.7 21l1.7-7L2 9.2l7.1-.6L12 2z"/></svg>
        <div style="flex:1;font-size:13.5px;font-weight:600;">전기요금 개편</div>
        <span style="font-family:-apple-system,sans-serif;font-size:11px;color:#6b6459;flex-shrink:0;">74건 · 22매체</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#a89f8c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M9 18l6-6-6-6"/></svg>
      </div>
      <div style="display:flex;align-items:center;gap:9px;padding:10px 2px;border-bottom:1px solid #d9d2bd;">
        <div style="width:13px;text-align:center;font-size:13px;font-weight:800;color:#8f2d24;flex-shrink:0;">2</div>
        <div style="flex:1;font-size:13.5px;font-weight:600;">지하철 파업 예고</div>
        <span style="font-family:-apple-system,sans-serif;font-size:11px;color:#6b6459;flex-shrink:0;">61건 · 18매체</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#a89f8c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M9 18l6-6-6-6"/></svg>
      </div>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
