<!DOCTYPE html><html><head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- 2026-10-13: viewport 메타가 없으면 모바일 브라우저가 로딩 중엔 980px 폭으로 그렸다가
       Flutter가 뜨면서 기기 폭으로 바뀌어, 스플래시 로고/로딩바가 작게 보이다가 갑자기
       커지는 문제가 있었음. 확대(핀치줌)는 접근성 때문에 막지 않음. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="여러 매체의 RSS를 모아 오늘 많이 보도된 이슈를 클러스터링해서 보여주는 뉴스 트렌드 앱">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Issue Pop">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Issue Pop</title>
  <link rel="manifest" href="manifest.json">
  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #17356B;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
  <style id="splash-loader-style">
    /* 2026-10-13: 스플래시 로고 아래 로딩바(앱 내 LaunchLoading과 같은 크기/위치). */
    #splash-loader {
      position: absolute;
      top: calc(50% + 92px);
      left: 50%;
      width: 96px;
      height: 3px;
      margin-left: -48px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.2);
      overflow: hidden;
    }
    #splash-loader::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 40%;
      background: #FFD03A;
      border-radius: 2px;
      animation: splash-loader-slide 1.1s ease-in-out infinite;
    }
    @keyframes splash-loader-slide {
      0% { left: -40%; }
      100% { left: 100%; }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash-loader")?.remove();
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
    // flutter_native_splash가 만든 스플래시는 이 Flutter 버전에서 자동 제거가 안 돼서
    // (flutter-view가 위에 덮여 안 보일 뿐 DOM엔 계속 남음), 앱이 뜨고 첫 프레임이
    // 그려질 시간을 조금 준 뒤 직접 지움.
    new MutationObserver(function (_, observer) {
      if (document.querySelector("flutter-view")) {
        observer.disconnect();
        setTimeout(removeSplashFromWeb, 600);
      }
    }).observe(document.documentElement, { childList: true, subtree: true });
  </script>
</head>
<body>
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>
  <div id="splash-loader" aria-hidden="true"></div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async=""></script>


</body></html>
